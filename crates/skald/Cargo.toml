[package]
name = "skald"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/robbestad/skald-lang"
documentation = "https://docs.rs/skald"
rust-version.workspace = true
description = "A dictionary-native generative language. Write a pattern, get a sentence."
readme = "../../README.md"
default-run = "skald"
keywords = ["procedural", "text", "generative", "wasm", "rant"]
categories = ["text-processing", "command-line-utilities", "wasm"]
include = [
    "src/**",
    "tests/**",
    "build.rs",
    "vocab/**",
    "Cargo.toml",
]

[features]
default = ["en-us"]
en-us = []
# Unicode property classes (`\p{L}`, …). Off by default so the wasm core stays small.
unicode-regex = ["regex/unicode"]

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "perf"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "skald"
path = "src/lib.rs"

[[bin]]
name = "skald"
path = "src/bin/skald.rs"
required-features = ["en-us"]

[[bin]]
name = "skald-export-dict"
path = "src/bin/export_dict.rs"
required-features = ["en-us"]
